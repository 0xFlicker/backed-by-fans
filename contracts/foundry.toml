[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
auto_detect_remappings = false

solc_version = "0.8.36"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
deny = "warnings"

bytecode_hash = "ipfs"
cbor_metadata = true
build_info = true
always_use_create_2_factory = true
create2_deployer = "0x4e59b44847b379578588920cA78FbF26c0B4956C"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.robinhood]
code_size_limit = 98_304
gas_limit = 100_000_000
block_gas_limit = 100_000_000

[profile.default.fuzz]
runs = 256
fail_on_revert = true

[profile.default.invariant]
runs = 256
depth = 500
fail_on_revert = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true
# The deployed testnet USDG CREATE2 identity includes both source files in Solidity metadata.
# Vendored dependencies are immutable inputs and must never be rewritten by a broad formatter run.
ignore = [
  "src/TestnetUSDG.sol",
  "src/RobinhoodProtocolAuthority.sol",
  "lib/**",
]
