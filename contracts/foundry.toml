[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
auto_detect_remappings = false

solc_version = "0.8.36"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
deny = "warnings"

bytecode_hash = "ipfs"
cbor_metadata = true
build_info = true

[profile.default.fuzz]
runs = 256
fail_on_revert = true

[profile.default.invariant]
runs = 256
depth = 500
fail_on_revert = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true
