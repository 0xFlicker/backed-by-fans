<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc"><title id="title">Early-support reward weight</title><desc id="desc">Illustrative 1.5 times starting boost tapers to 1 times after 1000 total payment units. The curve shows weight per additional payment unit, not a loss of previously earned weight. The first 100 units add 147.5 shares; 100 units paid after the threshold add 100 shares.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#11131a" stroke-width="1.4"/></marker></defs>
<rect width="1400" height="940" fill="#f7f2e8"/>
<text x="60" y="48" fill="#4d4f5d" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">BACKED BY FANS  /  03</text>
<text x="60" y="105" fill="#11131a" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="500" text-anchor="start">Earlier support can receive more weight.</text>
<text x="60" y="147" fill="#4d4f5d" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Illustrative curve: 1.5× starting weight, reaching 1× after 1,000 units paid into the tier.</text>
<text x="160" y="207" fill="#11131a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Weight per additional payment unit</text>
<path d="M160 585.0 H1260" fill="none" stroke="#c9c3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="131" y="592.0" fill="#4d4f5d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="end">1×</text>
<path d="M160 422.5 H1260" fill="none" stroke="#c9c3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="131" y="429.5" fill="#4d4f5d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="end">1.25×</text>
<path d="M160 260.0 H1260" fill="none" stroke="#c9c3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="131" y="267.0" fill="#4d4f5d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="end">1.5×</text>
<text x="160.0" y="622" fill="#4d4f5d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">0</text>
<text x="526.6666666666667" y="622" fill="#4d4f5d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">500</text>
<text x="893.3333333333334" y="622" fill="#4d4f5d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">1,000</text>
<text x="1260.0" y="622" fill="#4d4f5d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">1,500</text>
<path d="M160 250 V585 H1272" fill="none" stroke="#11131a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M893.3333333333334 250 V585" fill="none" stroke="#4d4f5d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"/>
<path d="M160 260.0 L893.3333333333334 585.0 H1260" fill="none" stroke="#574fe6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="410" y="343" fill="#574fe6" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">Bonus on new payments tapers</text>
<text x="1110" y="550" fill="#11131a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" text-anchor="middle">Normal weight</text>
<text x="710" y="672" fill="#11131a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="middle">Total paid into the tier (units)</text>
<rect x="60" y="714" width="610" height="129" rx="12" fill="#fffdf8" stroke="#c9c3b8" stroke-width="2"/>
<text x="86" y="750" fill="#11131a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">First 100 units paid</text>
<text x="86" y="791" fill="#11131a" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start">147.5 shares added</text>
<text x="86" y="822" fill="#4d4f5d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Includes the average bonus across that payment.</text>
<rect x="700" y="714" width="640" height="129" rx="12" fill="#fffdf8" stroke="#c9c3b8" stroke-width="2"/>
<text x="726" y="750" fill="#11131a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">100 units paid after the threshold</text>
<text x="726" y="791" fill="#11131a" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" text-anchor="start">100 shares added</text>
<text x="726" y="822" fill="#4d4f5d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Earlier shares keep their existing weight.</text>
<text x="60" y="893" fill="#11131a" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">The curve changes the weight added by new payments. Weight already earned does not shrink.</text>
<text x="60" y="926" fill="#4d4f5d" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Shares determine the split of eligible member rewards; they are not a promised reward amount.</text>
</svg>
