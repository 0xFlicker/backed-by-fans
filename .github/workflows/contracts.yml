name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Show Forge version
        run: forge --version

      - name: Check clean-room provenance
        run: ./scripts/check-clean-room.sh

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run unit and fuzz tests
        run: forge test --no-match-path "test/invariants/*.t.sol" -vvv

      - name: Run stateful invariants
        run: forge test --match-path "test/invariants/*.t.sol" -vvv

      - name: Install Slither
        run: pipx install slither-analyzer==0.11.6

      - name: Show Slither version
        run: slither --version

      - name: Run Slither high-severity gate
        run: slither . --config-file slither.config.json --fail-high
