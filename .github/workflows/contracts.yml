name: CI

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "scripts/**"
      - ".gitmodules"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/**"
      - ".gitmodules"
      - ".github/workflows/contracts.yml"
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: robinhood
    defaults:
      run:
        working-directory: contracts
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Show Forge version
        run: forge --version

      - name: Prepare clean-room provenance tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          git submodule foreach --recursive 'git fetch --tags --force'

      - name: Check clean-room provenance
        run: ./scripts/check-clean-room.sh

      - name: Run Forge fmt
        run: forge fmt --check src script test

      - name: Run Forge build
        run: forge build --ignore-eip-3860

      - name: Validate deployment tooling
        run: |
          bash -n ../scripts/verify-local.sh ../scripts/test-web-anvil.sh ../web/scripts/generate-contracts.sh scripts/public-chain-common.sh scripts/create-safe.sh scripts/test-create-safe.sh scripts/deploy-protocol.sh scripts/test-deploy-protocol.sh scripts/manage-payment-tokens.sh scripts/test-manage-payment-tokens.sh
          ./scripts/test-create-safe.sh
          ./scripts/test-deploy-protocol.sh
          ./scripts/test-manage-payment-tokens.sh
          forge test --match-path "test/deployment/*.t.sol" --code-size-limit 1000000 --gas-limit 1000000000 -vvv

      - name: Run unit and fuzz tests
        run: forge test --no-match-path "test/{invariants,deployment,fork}/*.t.sol" --code-size-limit 1000000 --gas-limit 1000000000 -vvv

      - name: Run stateful invariants
        run: forge test --match-path "test/invariants/*.t.sol" --code-size-limit 1000000 --gas-limit 1000000000 -vvv

      - name: Install Slither
        run: pipx install slither-analyzer==0.11.6

      - name: Show Slither version
        run: slither --version

      - name: Run Slither high-severity gate
        run: slither . --config-file slither.config.json --fail-high
