name: Web

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "scripts/protocol-fork/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/protocol-fork/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Next.js application
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format

      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Reject starter identity and obvious secret patterns
        run: |
          ! grep -R -E "Create Next App|next\.svg|vercel\.svg" src public
          ! grep -R -E "(PRIVATE_KEY|SECRET_KEY|MNEMONIC|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)" src public

  configured-anvil:
    name: Authentic protocol fork evidence
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Check generated contract bindings
        run: bun run generate:check

      - name: Run configured Anvil browser evidence
        env:
          CI: ""
          BBF_FORK_RPC_URL: ${{ secrets.ROBINHOOD_MAINNET_RPC_URL }}
          BBF_FORK_BLOCK_NUMBER: "57010735"
          BBF_FORK_BLOCK_HASH: "0xdfc65146f32cfd10afd9a620b68c3fc5d02077677ce06c46303e49e80f0a96cf"
          BBF_FORK_INPUTS: ${{ github.workspace }}/specs/003-protocol-buyback-burn/evidence/pinned-preflight-inputs-20260907.json
          BBF_FORK_EVIDENCE_DIR: ${{ runner.temp }}/bbf-fork-evidence
        run: ../scripts/test-web-anvil.sh

      - name: Retain fork receipts and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-fork-evidence
          path: ${{ runner.temp }}/bbf-fork-evidence
          if-no-files-found: error
