name: Web

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Next.js application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format

      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Build production application
        run: bun run build

      - name: Typecheck generated application types
        run: bun run typecheck

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser tests
        run: bun run test:e2e

      - name: Reject starter identity and obvious secret patterns
        run: |
          ! grep -R -E "Create Next App|next\.svg|vercel\.svg" src public .next/static
          ! grep -R -E "(PRIVATE_KEY|SECRET_KEY|MNEMONIC|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)" src public .next/static
