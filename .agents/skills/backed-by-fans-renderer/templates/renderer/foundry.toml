[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.36"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
deny = "warnings"
bytecode_hash = "ipfs"
cbor_metadata = true

[profile.robinhood]
code_size_limit = 98_304
gas_limit = 100_000_000
block_gas_limit = 100_000_000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true
